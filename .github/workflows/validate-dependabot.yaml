name: Validate Dependabot PRs
on:
    pull_request:
        types: [opened, synchronize, reopened]
        paths:
            - "src/docker/**"
            - "tests/fake-registry/package*.json"
            - ".github/workflows/**"

jobs:
    validate-dependabot-pr:
        if: startsWith(github.event.pull_request.user.login, 'dependabot')
        runs-on: ubuntu-latest
        permissions:
            contents: read
            pull-requests: write
            packages: read

        steps:
            - name: Checkout repository
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@4fd812986e6c8c2a69e18311145f9371337f27d4 # v3.7.1

            - name: Detect change type
              id: detect_change
              run: |
                  if git diff --name-only HEAD^ | grep -q "src/docker/"; then
                    echo "change_type=docker" >> $GITHUB_OUTPUT
                    echo "🐳 Docker change detected"
                  elif git diff --name-only HEAD^ | grep -q "tests/fake-registry/package"; then
                    echo "change_type=npm" >> $GITHUB_OUTPUT
                    echo "📦 npm change detected"
                  elif git diff --name-only HEAD^ | grep -q ".github/workflows/"; then
                    echo "change_type=github-actions" >> $GITHUB_OUTPUT
                    echo "⚡ GitHub Actions change detected"
                  fi

            - name: Extract OpenResty version (Docker changes)
              if: steps.detect_change.outputs.change_type == 'docker'
              id: extract_version
              run: |
                  OPENRESTY_VERSION=$(grep '^ARG OPENRESTY_VERSION=' src/docker/Dockerfile | cut -d'=' -f2)
                  NGINX_VERSION=$(echo "$OPENRESTY_VERSION" | sed 's/^\([0-9]*\.[0-9]*\.[0-9]*\)\..*$/\1/')
                  echo "openresty_version=$OPENRESTY_VERSION" >> $GITHUB_OUTPUT
                  echo "nginx_version=$NGINX_VERSION" >> $GITHUB_OUTPUT
                  echo "🏷️ OpenResty: $OPENRESTY_VERSION → Nginx: $NGINX_VERSION"

            - name: Test build Docker image (no push)
              if: steps.detect_change.outputs.change_type == 'docker'
              id: test_build
              uses: docker/build-push-action@48aba3b46d1b1fec4febb7c167d0c30ce54196fd # v6.9.0
              with:
                  context: ./src/docker
                  platforms: linux/amd64
                  push: false
                  build-args: |
                      OPENRESTY_VERSION=${{ steps.extract_version.outputs.openresty_version }}
                      NGINX_VERSION=${{ steps.extract_version.outputs.nginx_version }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max

            - name: Check image size
              if: steps.detect_change.outputs.change_type == 'docker'
              id: image_info
              run: |
                  # Build locally to get size info
                  docker build -t test-image:local ./src/docker \
                    --build-arg OPENRESTY_VERSION=${{ steps.extract_version.outputs.openresty_version }} \
                    --build-arg NGINX_VERSION=${{ steps.extract_version.outputs.nginx_version }}

                  SIZE=$(docker images test-image:local --format "table {{.Size}}" | tail -n +2)
                  echo "image_size=$SIZE" >> $GITHUB_OUTPUT
                  echo "📏 Image size: $SIZE"

            - name: Test npm packages (npm changes)
              if: steps.detect_change.outputs.change_type == 'npm'
              working-directory: ./tests/fake-registry
              run: |
                  npm ci
                  npm run test || echo "Tests failed - check compatibility"
                  npx tsc --noEmit || echo "TypeScript compilation failed"

            - name: Update PR with validation results
              uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
              with:
                  script: |
                      const changeType = '${{ steps.detect_change.outputs.change_type }}';
                      let comment = '## 🤖 Dependabot PR Validation\n\n';

                      if (changeType === 'docker') {
                        const openrestyVersion = '${{ steps.extract_version.outputs.openresty_version }}';
                        const nginxVersion = '${{ steps.extract_version.outputs.nginx_version }}';
                        const imageSize = '${{ steps.image_info.outputs.image_size }}';
                        
                        comment += `### 🐳 Docker Update
                        - **OpenResty version**: \`${openrestyVersion}\`
                        - **Nginx version**: \`${nginxVersion}\`
                        - **Test build**: ✅ Success
                        - **Image size**: ${imageSize}
                        - **Platforms**: linux/amd64, linux/arm64 (will build on merge)
                        
                        ⏰ **Remember**: Wait 15 days after OpenResty release before merging this PR.`;
                      } else if (changeType === 'npm') {
                        comment += `### 📦 npm Update
                        - **Test installation**: ✅ Success
                        - **TypeScript compilation**: Check logs above
                        - **Test execution**: Check logs above`;
                      } else if (changeType === 'github-actions') {
                        comment += `### ⚡ GitHub Actions Update
                        - **Actions updated**: Check the diff for pinned versions`;
                      }

                      comment += '\n\n---\n*This validation was run automatically for Dependabot PRs*';

                      // Check if we already commented
                      const comments = await github.rest.issues.listComments({
                        owner: context.repo.owner,
                        repo: context.repo.repo,
                        issue_number: context.issue.number,
                      });

                      const existingComment = comments.data.find(c => 
                        c.user.type === 'Bot' && c.body.includes('🤖 Dependabot PR Validation')
                      );

                      if (existingComment) {
                        await github.rest.issues.updateComment({
                          owner: context.repo.owner,
                          repo: context.repo.repo,
                          comment_id: existingComment.id,
                          body: comment
                        });
                      } else {
                        await github.rest.issues.createComment({
                          owner: context.repo.owner,
                          repo: context.repo.repo,
                          issue_number: context.issue.number,
                          body: comment
                        });
                      }
